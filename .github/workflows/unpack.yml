name: Unpack upload

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app files
        run: |
          set -e
          unzip -o par-inventory-upload.zip -d /tmp/pi
          cp /tmp/pi/par-inventory/server.js /tmp/pi/par-inventory/seed.json /tmp/pi/par-inventory/package.json /tmp/pi/par-inventory/package-lock.json /tmp/pi/par-inventory/render.yaml /tmp/pi/par-inventory/README.md /tmp/pi/par-inventory/.gitignore /tmp/pi/par-inventory/.node-version .
          mkdir -p public
          cp /tmp/pi/par-inventory/public/index.html /tmp/pi/par-inventory/public/app.js public/
          rm -f par-inventory-upload.zip
      - name: Commit files
        run: |
          git config user.name "markstarshipv"
          git config user.email "mark@spurling.net"
          git add -A
          git status --short
          git commit -m "Initial deploy"
          git push
