services:
  - type: web
    name: starship-v-par-inventory
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: starship-v-par-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: REPORT_TOKEN
        generateValue: true
databases:
  - name: starship-v-par-db
    plan: basic-256mb
    postgresMajorVersion: "16"
